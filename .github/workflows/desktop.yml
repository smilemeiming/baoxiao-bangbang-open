name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'utils/**'
      - 'cloudfunctions/invoice-ocr/normalizer.js'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: BaoxiaoBangbang-Windows-x64
          path: desktop/dist/*.zip
          retention-days: 14
